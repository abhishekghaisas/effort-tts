[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "efforttts"
version = "0.0.1"
description = "Speaker-preserving vocal-effort control for TTS"
requires-python = ">=3.10"
# Keep this light. torch/torchaudio are NOT listed: Colab ships them,
# and on the Mac you install them deliberately (see README).
dependencies = [
  "numpy",
  "scipy",
  "pandas",
  "soundfile",
  "librosa",
  "pyyaml",
  "tqdm",
  "scikit-learn"
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "ipykernel"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
